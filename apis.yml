name: Tivoli
description: 'Tivoli Systems was an Austin, Texas systems-management software company
  founded in 1989 that helped enterprises manage distributed client/server networks
  of PCs and workstations. After a 1995 NASDAQ IPO (TIVS), IBM acquired Tivoli in
  March 1996 for approximately $743 million, and it became the IBM Tivoli enterprise
  systems and network management brand before IBM retired the name and folded its
  products into other IBM software lines. A historic Norwest venture exit, Tivoli
  no longer exists as an independent company and publishes no independent API surface;
  tivoli.com is an IBM-held domain that redirects toward ibm.com.'
